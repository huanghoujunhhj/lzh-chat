<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF8FA3" />
  <title>分身聊天 · AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌸%3C/text%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="view-home">
  <div class="app" id="app">

    <!-- 主页：选择分身 -->
    <section class="home-view" id="homeView">
      <header class="home-header">
        <h1>分身聊天</h1>
        <p class="home-sub">挑一个 TA，开启对话</p>
      </header>
      <div class="character-grid" id="characterGrid">
        <!-- 角色卡片由 JS 渲染 -->
      </div>
    </section>

    <!-- 聊天界面 -->
    <aside class="sidebar" id="sidebar" aria-label="历史会话">
      <div class="sidebar-header">
        <div class="brand">
          <img class="brand-avatar-img" id="brandAvatar" alt="" src="assets/avatar-lzh.jpg" />
          <div class="brand-text">
            <div class="brand-title" id="brandTitle">刘梓菡</div>
            <div class="brand-sub" id="brandSub">数学课代表</div>
          </div>
        </div>
      </div>

      <button class="new-chat-btn" id="newChatBtn" type="button" title="新建会话">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M11 11V5h2v6h6v2h-6v6h-2v-6H5v-2z"/>
        </svg>
        <span>新建会话</span>
      </button>

      <div class="session-list" id="sessionList" role="list" aria-label="会话列表">
        <!-- 会话项由 JS 动态生成 -->
      </div>

      <div class="sidebar-footer">
        <button class="back-home-btn" id="backHomeBtn" type="button" title="回到主页">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
          <span>返回主页</span>
        </button>
        <button class="clear-all-btn" id="clearAllBtn" type="button" title="清空所有对话">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
          </svg>
          <span>清空对话</span>
        </button>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn home-back-btn" id="homeBackBtn" type="button" title="返回主页选分身" aria-label="返回主页">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
        <button class="hamburger" id="hamburgerBtn" type="button" aria-label="打开侧边栏">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/>
          </svg>
        </button>
        <button class="topbar-character" id="switchCharBtn" type="button" title="切换分身" aria-label="切换分身">
          <img class="topbar-avatar-img" id="topbarAvatar" alt="" />
          <div class="topbar-char-text">
            <div class="topbar-name" id="topbarName">刘梓菡</div>
            <div class="topbar-status" id="statusText">切换分身 ▾</div>
          </div>
        </button>
        <button class="icon-btn settings-btn" id="settingsBtn" type="button" title="设置" aria-label="设置">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.43h-3.84a.5.5 0 0 0-.5.43l-.36 2.54c-.59.24-1.13.56-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88L2.77 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.6.22l2.39-.96c.5.38 1.04.7 1.63.94l.36 2.54c.05.24.25.43.5.43h3.84c.25 0 .45-.19.5-.43l.36-2.54c.59-.24 1.13-.56 1.63-.94l2.39.96c.17.12.46.02.6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
          </svg>
        </button>
      </header>

      <section class="messages" id="messages" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">🌸</div>
          <div class="empty-title" id="emptyTitle">开始聊天吧～</div>
          <div class="empty-sub" id="emptySub">问点数学题、聊聊排球，或者随便说点什么</div>
        </div>
      </section>

      <footer class="composer">
        <textarea
          id="input"
          class="composer-input"
          rows="1"
          placeholder="说点什么…（Shift+Enter 换行）"
          aria-label="输入消息"
        ></textarea>
        <button id="sendBtn" class="send-btn" type="button" title="发送（Enter）" aria-label="发送">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/>
          </svg>
        </button>
      </footer>
    </main>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal" id="settingsModal" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card" role="dialog" aria-labelledby="settingsTitle" aria-modal="true">
      <div class="modal-header">
        <h2 id="settingsTitle">设置</h2>
        <button class="icon-btn" id="closeSettingsBtn" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <label class="switch-label">
            <span>启用真实 AI（关闭则使用本地智能回复）</span>
            <label class="switch">
              <input type="checkbox" id="useRealAiToggle" />
              <span class="slider"></span>
            </label>
          </label>
        </div>

        <div class="setting-group" id="aiSettingsGroup">
          <div class="setting-row">
            <label>预设服务（一键填入 Base URL 和模型）</label>
            <div class="preset-chips" id="presetChips">
              <!-- 预设由 JS 渲染 -->
            </div>
          </div>
          <div class="setting-row">
            <label for="baseUrlInput">API Base URL</label>
            <input id="baseUrlInput" type="text" placeholder="https://api.openai.com/v1" />
          </div>
          <div class="setting-row">
            <label for="apiKeyInput">API Key</label>
            <input id="apiKeyInput" type="password" placeholder="sk-..." />
          </div>
          <div class="setting-row">
            <label for="modelInput">模型</label>
            <input id="modelInput" type="text" placeholder="gpt-3.5-turbo" />
          </div>
          <div class="setting-row">
            <label for="systemPromptInput">系统提示词（当前角色人设）</label>
            <textarea id="systemPromptInput" rows="8"></textarea>
          </div>
          <div class="setting-row inline">
            <button class="btn-secondary" id="testConnectionBtn" type="button">测试连接</button>
            <button class="btn-primary" id="saveSettingsBtn" type="button">保存</button>
          </div>
          <div class="setting-hint">
            ⚠️ API Key 仅保存在你本地浏览器，不会上传服务器。若遇跨域问题，可配合 Cloudflare Worker 中转。
          </div>
        </div>

        <div class="setting-divider"></div>

        <div class="setting-row">
          <label class="switch-label">
            <span>主动互动（TA 会主动找你搭话、分享小事）</span>
            <label class="switch">
              <input type="checkbox" id="proactiveToggle" />
              <span class="slider"></span>
            </label>
          </label>
        </div>
        <div class="setting-row" id="proactiveIntervalRow">
          <label for="proactiveInterval">沉默多久后，TA 主动开口</label>
          <select id="proactiveInterval">
            <option value="30">30 秒</option>
            <option value="60">1 分钟</option>
            <option value="90">1.5 分钟</option>
            <option value="120">2 分钟</option>
            <option value="180">3 分钟</option>
          </select>
        </div>

        <div class="setting-divider"></div>

        <div class="setting-row">
          <button class="btn-danger" id="clearAllInSettingsBtn" type="button">清空当前角色所有对话记录</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 创建/编辑分身弹窗 -->
  <div class="modal" id="characterModal" hidden>
    <div class="modal-backdrop" id="characterBackdrop"></div>
    <div class="modal-card" role="dialog" aria-labelledby="characterTitle" aria-modal="true">
      <div class="modal-header">
        <h2 id="characterTitle">添加分身</h2>
        <button class="icon-btn" id="closeCharacterBtn" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="setting-row char-avatar-row">
          <label>头像</label>
          <div class="char-avatar-picker">
            <img id="charAvatarPreview" alt="" />
            <label for="charAvatarInput" class="char-avatar-upload">选择图片</label>
            <input id="charAvatarInput" type="file" accept="image/*" hidden />
          </div>
        </div>
        <div class="setting-row">
          <label for="charNameInput">名字</label>
          <input id="charNameInput" type="text" placeholder="例如：林夏、弟弟、温柔学姐…" />
        </div>
        <div class="setting-row">
          <label for="charTaglineInput">一句话简介</label>
          <input id="charTaglineInput" type="text" placeholder="例如：你的青梅竹马 / 数学课代表" />
        </div>
        <div class="setting-row">
          <label for="charPersonaInput">人设 / 性格描述</label>
          <textarea id="charPersonaInput" rows="6" placeholder="例如：性格温柔、说话轻声细语，喜欢看书；对外人礼貌疏远，对熟人撒娇。回复时常用括号写动作。" ></textarea>
        </div>
        <div class="setting-row">
          <label for="charGreetingInput">开场白（可选）</label>
          <textarea id="charGreetingInput" rows="2" placeholder="例如：（抬起头笑了笑）在呢，今天怎么想起我了～"></textarea>
        </div>
        <div class="setting-row">
          <label for="charSpecialInput">特殊设定（可选填）</label>
          <textarea id="charSpecialInput" rows="3" placeholder="输入这个分身独有的特点或身份。例如：其实是隐藏的学霸 / 表面高冷其实暗恋你 / 来自异世界的精灵…这一条会作为 TA 独有的隐藏设定融入对话。"></textarea>
        </div>
        <div class="setting-row inline">
          <button class="btn-danger" id="deleteCharacterBtn" type="button" hidden>删除该分身</button>
          <button class="btn-primary" id="saveCharacterBtn" type="button">保存分身</button>
        </div>
        <div class="setting-hint">
          头像会保存在你浏览器本地（base64），不上传服务器。建议图片 ≤ 500KB，正方形最佳。
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
